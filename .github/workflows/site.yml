name: Site

on:
  push:
    branches: [main]
    paths: ["book/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      # Docs only: the app and data live behind sign-in at asfiled.io, so
      # the Pages mirror must not serve an ungated copy. Old /app and /data
      # URLs redirect to the product.
      - name: Assemble site
        run: |
          mdbook build book
          mkdir -p site/app site/data
          cp -r book/book/* site/
          cat > site/app/index.html <<'HTML'
          <!DOCTYPE html><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=https://asfiled.io/app/">
          <title>asfiled</title><a href="https://asfiled.io/app/">asfiled.io/app</a>
          HTML
          cp site/app/index.html site/data/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
