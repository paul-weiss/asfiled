name: Security audit

on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", ".github/workflows/audit.yml"]
  schedule:
    - cron: "0 9 * * 1" # weekly — advisories land independently of commits
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies (RustSec advisory DB)
        run: cargo audit
